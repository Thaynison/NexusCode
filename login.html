<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso à Plataforma | Nexus Code Brasil</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg">
  <link rel="alternate icon" type="image/png" href="img/nexus.png">
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 80% 20%, rgba(0, 180, 216, 0.22) 0%, rgba(10, 29, 55, 0) 45%),
        linear-gradient(135deg, #061224 0%, #0A1D37 58%, #0F2E56 100%);
      font-family: 'Inter', sans-serif;
    }
    .auth-wrapper {
      width: 100%;
      max-width: 454px;
      padding: 24px;
    }
    .back-btn {
      position: absolute;
      top: 22px;
      left: 22px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0A1D37;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .back-btn:hover { background: #0A1D37; color: #00B4D8; border-color: #0A1D37; }
    .nc-auth-logo-stack {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .nc-auth-logo-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: #0A1D37;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .nc-auth-logo-sub {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 800;
      color: var(--primary, #00B4D8);
      letter-spacing: 0.34em;
      line-height: 1;
    }
    .nc-auth-submit {
      background: linear-gradient(135deg, var(--primary-hover, #0A1D37) 0%, var(--primary, #0096B4) 100%) !important;
      box-shadow: 0 10px 22px -5px rgba(0, 180, 216, 0.35) !important;
    }
    .nc-link-btn { color: var(--primary, #0096B4) !important; }
    .nc-input-wrap input:focus {
      border-color: var(--primary, #00B4D8) !important;
      box-shadow: 0 0 0 4px rgba(0, 180, 216, 0.14) !important;
    }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="nc-auth-card">
      <a href="index.html" id="login-back-btn" class="back-btn" title="Voltar ao site institucional" aria-label="Voltar ao site">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </a>

      <div class="nc-auth-header">
        <div class="nc-auth-logo-stack" id="login-brand-stack">
          <div style="width:48px; height:48px; border-radius:14px; background:#0A1D37; display:flex; align-items:center; justify-content:center; padding:8px; box-shadow:0 8px 20px rgba(10,29,55,0.25);">
            <svg viewBox="0 0 320 220" width="32" height="22">
              <g transform="translate(160, 110)">
                <path d="M -80 80 L -80 -80 L 80 80 L 80 -80" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="square" stroke-linejoin="miter"/>
                <path d="M -80 -80 L -140 -80" fill="none" stroke="#00B4D8" stroke-width="14" stroke-linecap="square"/>
                <circle cx="-140" cy="-80" r="13" fill="#00B4D8"/>
                <path d="M -80 0 L -120 0" fill="none" stroke="#00B4D8" stroke-width="14" stroke-linecap="square"/>
                <circle cx="-120" cy="0" r="13" fill="#00B4D8"/>
                <path d="M 80 80 L 140 80" fill="none" stroke="#00B4D8" stroke-width="14" stroke-linecap="square"/>
                <circle cx="140" cy="80" r="13" fill="#00B4D8"/>
                <path d="M 80 0 L 120 0" fill="none" stroke="#00B4D8" stroke-width="14" stroke-linecap="square"/>
                <circle cx="120" cy="0" r="13" fill="#00B4D8"/>
                <circle cx="0" cy="0" r="20" fill="#00B4D8"/>
                <circle cx="0" cy="0" r="8" fill="#0A1D37"/>
              </g>
            </svg>
          </div>
          <span class="nc-auth-logo-title">NEXUS <span style="color:#00B4D8;">CODE</span></span>
          <span class="nc-auth-logo-sub">BRASIL</span>
        </div>
        <h2 id="auth-title">Acesso à Plataforma</h2>
        <p id="auth-subtitle">Insira suas credenciais para continuar</p>
      </div>

      <div class="nc-auth-tabs" role="tablist">
        <button type="button" class="nc-tab active" data-auth-tab="login">Entrar</button>
        <button type="button" class="nc-tab" data-auth-tab="register">Cadastrar-se</button>
        <button type="button" class="nc-tab" data-auth-tab="forgot">Recuperar senha</button>
      </div>

      <form id="auth-form" class="nc-auth-form">
        <input type="hidden" name="mode" value="login">

        <div id="auth-extra"></div>

        <div class="nc-field">
          <label for="auth-username">E-mail</label>
          <div class="nc-input-wrap">
            <svg class="nc-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
            <input id="auth-username" name="username" type="email" placeholder="nome@empresa.com.br" required autocomplete="username">
          </div>
        </div>

        <div class="nc-field" id="password-wrap">
          <div class="nc-label-row">
            <label for="auth-password">Senha</label>
            <button type="button" class="nc-link-btn" data-auth-tab="forgot">Esqueceu a senha?</button>
          </div>
          <div class="nc-input-wrap">
            <svg class="nc-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input id="auth-password" name="password" type="password" placeholder="Informe sua senha" minlength="6" required autocomplete="current-password">
            <button type="button" id="toggle-password" class="nc-eye-btn" title="Mostrar ou ocultar senha" aria-label="Mostrar ou ocultar senha">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div id="auth-status" class="nc-auth-status" aria-live="polite"></div>

        <button type="submit" id="auth-submit-btn" class="nc-auth-submit">
          <span>Acessar Plataforma</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <div id="saas-signup-callout" style="margin-top:16px; text-align:center;">
        <a href="index.html#portal-saas" style="font-size:12.5px; font-weight:700; color:#0096B4; text-decoration:none;">
          Quer usar o Portal Nexus na sua empresa? Teste grátis por 14 dias &rarr;
        </a>
      </div>

      <div class="nc-auth-footer" id="login-footer-text">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg>
        <span>Ambiente Seguro • Nexus Code Brasil</span>
      </div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
