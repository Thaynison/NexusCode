<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso Corporativo | Nexus Code</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="img/nexus.png">
  <link rel="stylesheet" href="assets/css/app.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a0a0a 0%, #111827 50%, #0052cc 100%);
      font-family: 'Inter', sans-serif;
    }
    .auth-wrapper {
      width: 100%;
      max-width: 440px;
      padding: 24px;
    }
    .back-btn {
      position: absolute;
      top: 22px;
      left: 22px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .back-btn:hover { background: #e2e8f0; color: #0f172a; }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="nc-auth-card">
      <a href="index.html" class="back-btn" title="Voltar ao site institucional" aria-label="Voltar ao site">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </a>

      <div class="nc-auth-header">
        <div class="nc-auth-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
          <span>NEXUS<b>CODE</b></span>
        </div>
        <span class="nc-auth-pill">PLATAFORMA CORPORATIVA</span>
        <h2 id="auth-title">Acesso à Plataforma</h2>
        <p id="auth-subtitle">Insira suas credenciais para continuar</p>
      </div>

      <div class="nc-auth-tabs" role="tablist">
        <button type="button" class="nc-tab active" data-auth-tab="login">Entrar</button>
        <button type="button" class="nc-tab" data-auth-tab="register">Cadastrar-se</button>
        <button type="button" class="nc-tab" data-auth-tab="forgot">Recuperar senha</button>
      </div>

      <form id="auth-form" class="nc-auth-form">
        <input type="hidden" name="mode" value="login">

        <div id="auth-extra"></div>

        <div class="nc-field">
          <label for="auth-username">E-mail</label>
          <div class="nc-input-wrap">
            <svg class="nc-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
            <input id="auth-username" name="username" type="email" placeholder="nome@empresa.com.br" required autocomplete="username">
          </div>
        </div>

        <div class="nc-field" id="password-wrap">
          <div class="nc-label-row">
            <label for="auth-password">Senha</label>
            <button type="button" class="nc-link-btn" data-auth-tab="forgot">Esqueceu a senha?</button>
          </div>
          <div class="nc-input-wrap">
            <svg class="nc-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input id="auth-password" name="password" type="password" placeholder="Informe sua senha" minlength="6" required autocomplete="current-password">
            <button type="button" id="toggle-password" class="nc-eye-btn" title="Mostrar ou ocultar senha" aria-label="Mostrar ou ocultar senha">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div id="auth-status" class="nc-auth-status" aria-live="polite"></div>

        <button type="submit" id="auth-submit-btn" class="nc-auth-submit">
          <span>Acessar Plataforma</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <div class="nc-auth-footer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg>
        <span>Ambiente Seguro • Nexus Code</span>
      </div>
    </div>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
