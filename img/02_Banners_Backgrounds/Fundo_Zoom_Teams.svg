<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0A1D37"/>
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00B4D8" stroke-width="1" opacity="0.05"/>
  </pattern>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  
  <g transform="translate(1600, 150) scale(0.5)">
    <path d="M -80 80 L -80 -80 L 80 80 L 80 -80" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M -80 -80 L -140 -80" fill="none" stroke="#00B4D8" stroke-width="12" stroke-linecap="square"/>
    <circle cx="-140" cy="-80" r="12" fill="#00B4D8"/>
    <path d="M -80 0 L -120 0" fill="none" stroke="#00B4D8" stroke-width="12" stroke-linecap="square"/>
    <circle cx="-120" cy="0" r="12" fill="#00B4D8"/>
    <path d="M 80 80 L 140 80" fill="none" stroke="#00B4D8" stroke-width="12" stroke-linecap="square"/>
    <circle cx="140" cy="80" r="12" fill="#00B4D8"/>
    <path d="M 80 0 L 120 0" fill="none" stroke="#00B4D8" stroke-width="12" stroke-linecap="square"/>
    <circle cx="120" cy="0" r="12" fill="#00B4D8"/>
    <circle cx="0" cy="0" r="18" fill="#00B4D8"/>
    <circle cx="0" cy="0" r="8" fill="#0A1D37"/>
    <text x="0" y="160" font-family="Montserrat, Arial, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">NEXUS CODE</text>
    <text x="0" y="210" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="700" fill="#00B4D8" text-anchor="middle" letter-spacing="18">BRASIL</text>
  </g>
</svg>