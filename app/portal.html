<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portal do Cliente | Nexus Code Brasil</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="../assets/brand/favicon.svg">
  <link rel="alternate icon" type="image/png" href="../img/nexus.png">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body class="crm-app">
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <div class="shell" id="app-shell">
    <aside class="side" id="app-side">
      <div class="brand">
        <svg viewBox="0 0 320 220" width="28" height="20"><g transform="translate(160, 110)"><path d="M -80 80 L -80 -80 L 80 80 L 80 -80" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="square" stroke-linejoin="miter"/><path d="M -80 -80 L -140 -80" fill="none" stroke="#00B4D8" stroke-width="12" stroke-linecap="square"/><circle cx="-140" cy="-80" r="12" fill="#00B4D8"/><path d="M -80 0 L -120 0" fill="none" stroke="#00B4D8" stroke-width="12" stroke-linecap="square"/><circle cx="-120" cy="0" r="12" fill="#00B4D8"/><path d="M 80 80 L 140 80" fill="none" stroke="#00B4D8" stroke-width="12" stroke-linecap="square"/><circle cx="140" cy="80" r="12" fill="#00B4D8"/><path d="M 80 0 L 120 0" fill="none" stroke="#00B4D8" stroke-width="12" stroke-linecap="square"/><circle cx="120" cy="0" r="12" fill="#00B4D8"/><circle cx="0" cy="0" r="18" fill="#00B4D8"/><circle cx="0" cy="0" r="8" fill="#0A1D37"/></g></svg>
        <span style="letter-spacing:0.02em; font-weight:800;">NEXUS<b style="color:#00B4D8; font-weight:700;">CODE</b></span>
      </div>
      <nav class="nav">
        <div class="nav-group">Visão Geral</div>
        <button data-page="overview" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="12" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect></svg>
          <span class="nav-label">Painel do Cliente</span>
        </button>

        <div class="nav-group">Projetos &amp; Comercial</div>
        <button data-page="proposals">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="m9 15 2 2 4-4"></path></svg>
          <span class="nav-label">Propostas &amp; Contratos</span>
          <span class="nav-badge" id="portal-prop-badge" style="display:none;">0</span>
        </button>
        <button data-page="projects">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg>
          <span class="nav-label">Meus Projetos</span>
        </button>
        <button data-page="quotes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          <span class="nav-label">Solicitações &amp; Novos Projetos</span>
        </button>
        <button data-page="tickets">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path></svg>
          <span class="nav-label">Suporte &amp; Chamados</span>
          <span class="nav-badge" id="portal-ticket-badge" style="display:none;">0</span>
        </button>

        <div class="nav-group">Financeiro &amp; Conta</div>
        <button data-page="invoices">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
          <span class="nav-label">Minhas Faturas</span>
        </button>
        <button data-page="profile">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="10" r="3"></circle><path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"></path></svg>
          <span class="nav-label">Meu Perfil</span>
        </button>
      </nav>
      <div class="side-footer">
        <button id="logout" class="btn-logout">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span class="nav-label">Encerrar Sessão</span>
        </button>
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <div class="top-left">
          <button class="btn secondary icon-only" id="app-menu" title="Alternar menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <b id="portal-title" style="font-size:16px;">Portal do Cliente</b>
        </div>
        <div class="top-actions">
          <div class="notif-wrap" style="position:relative;">
            <button id="portal-notif-btn" class="btn secondary icon-only" title="Notificações" aria-label="Notificações">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
              <span id="portal-notif-count" class="notif-dot" style="display:none;">0</span>
            </button>
            <div id="portal-notif-popover" class="notif-popover" style="display:none;"></div>
          </div>

          <div class="user-chip" style="cursor:pointer;" onclick="window.portalGo('profile')">
            <div class="user-avatar" id="portal-initials">CL</div>
            <span id="portal-user">Cliente</span>
          </div>
          <button class="btn secondary icon-only" id="theme" title="Alternar tema">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
          </button>
        </div>
      </header>
      <section class="content" id="view"></section>
    </main>
  </div>

  <!-- Modal Interativo do Portal do Cliente -->
  <dialog id="portal-dialog" class="dialog planner-dialog">
    <div id="portal-modal-container" class="modal"></div>
  </dialog>

  <script type="module" src="../assets/js/portal.js"></script>
</body>
</html>
